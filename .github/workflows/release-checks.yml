name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install offline test dependencies from the shared requirements
        shell: python
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Offline tests mock model runtimes; keep all versions in one manifest.
          model_packages = {"torch", "transformers", "vllm", "qwen-vl-utils", "tensorboard"}
          requirements = []
          for line in Path("requirements.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name = re.split(r"[<>=!~;\s\[]", line, maxsplit=1)[0].lower().replace("_", "-")
              if name not in model_packages:
                  requirements.append(line)
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--no-cache-dir", *requirements])
      - run: python scripts/check_release.py --history
      - run: python -m pytest
